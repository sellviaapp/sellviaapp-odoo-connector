name: Validate Odoo add-on

on:
  push:
    branches: ["17.0", "main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate module and marketplace assets
        run: python tools/validate_module.py
      - name: Build installable ZIP
        run: python tools/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: sellviaapp-odoo-connector
          path: dist/*.zip
          if-no-files-found: error
